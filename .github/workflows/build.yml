name: Build
on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            build: .\build.ps1
          - os: ubuntu-latest
            build: ./build.sh
    runs-on: ${{matrix.os}}

    steps:
      # Prepare
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          show-progress: false
      - uses: gittools/actions/gitversion/setup@v3.2.1
        with:
          versionSpec: '5.12.x'
      - uses: gittools/actions/gitversion/execute@v3.2.1
        id: gitversion
      - name: Install MSVC Runtime
        if: runner.os == 'Windows'
        run: winget install --force --silent --accept-package-agreements --accept-source-agreements --disable-interactivity --id=Microsoft.VCRedist.2010.x86
      - name: Install D3DX9
        if: runner.os == 'Windows'
        run: |
          Invoke-WebRequest -Uri https://www.nuget.org/api/v2/package/Microsoft.DXSDK.D3DX/9.29.952.8 -OutFile dxsdk.zip
          Expand-Archive dxsdk.zip dxsdk
          Copy-Item dxsdk\build\native\release\bin\x86\D3DX9_43.dll C:\Windows\SysWOW64

      # Build
      - name: Build
        run: ${{matrix.build}} ${{steps.gitversion.outputs.nuGetVersion}}
      - name: Upload UnitTests bin artifact
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: UnitTests-bin
          path: src/UnitTests/bin
      - name: Report test results
        if: runner.os == 'Windows' && always()
        uses: dorny/test-reporter@v2
        with:
          name: Test Report
          reporter: dotnet-trx
          path: src/UnitTests/TestResults/*.trx

      # Release
      - name: Get tag message
        if: runner.os == 'Windows' && github.ref_type == 'tag'
        id: tag_message
        run: |
          "message<<EOF" >> $env:GITHUB_OUTPUT
          git fetch -f origin tag ${{github.ref_name}}
          git tag --format="%(contents)" -l ${{github.ref_name}} >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT
      - name: Create GitHub Release
        if: runner.os == 'Windows' && github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          body: |
            **[Documentation and download instructions](https://docs.omegaengine.de/)**
            ## Changes
            ${{steps.tag_message.outputs.message}}

      # Publish
      - name: Upload feeds
        if: runner.os == 'Windows' && github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          path: feeds/*-${{steps.gitversion.outputs.nuGetVersion}}.*
          compression-level: 0
      - name: Publish packages (GitHub)
        if: runner.os == 'Windows' && github.event_name == 'push' && !startsWith(github.ref_name, 'renovate/')
        run: dotnet nuget push artifacts\Release\*.nupkg --source https://nuget.pkg.github.com/${{github.repository_owner}}/index.json --api-key ${{github.token}} --no-symbols --skip-duplicate
      - name: Publish packages (NuGet.org)
        if: runner.os == 'Windows' && github.ref_type == 'tag'
        run: dotnet nuget push artifacts\Release\*.nupkg --source nuget.org --api-key ${{secrets.NUGET_API_KEY}}
      - name: Publish documentation
        if: runner.os == 'Windows' && github.ref_type == 'tag'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{github.token}}
          force_orphan: true
          publish_dir: artifacts/Documentation
          cname: docs.omegaengine.de
